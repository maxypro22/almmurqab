# Publishes hostinger-site/ to GitHub Pages as a noindex preview on every push to main.
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node seo-build/preview.mjs "/${{ github.event.repository.name }}" _preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview
      - uses: actions/deploy-pages@v4
